server {
    listen 80;
    listen [::]:80;  # IPv6 support
    root /usr/share/nginx/html;
    index index.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Rate limiting zone (10 requests per second per client IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    # API proxy to backend with enhanced settings
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;  # Rate limiting
        limit_req_status 429;  # Return 429 when rate limited
        
        proxy_pass http://nexos-backend:5000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Cache bypass for real-time requests
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        
        # Error handling
        proxy_intercept_errors on;
        error_page 502 503 504 =500 @proxy_error;
    }
    
    # Custom error page for proxy errors
    location @proxy_error {
        return 503 '{"error": "Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
    
    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Disable caching for HTML files to ensure fresh content
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
        # Cache static assets with optimization
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Enable gzip compression for static assets
        gzip_static on;
        
        # Add ETag for cache validation
        etag on;
        
        # Log less for static files
        access_log off;
        
        # Enable sendfile for better performance
        sendfile on;
        tcp_nopush on;
        
        # Security: prevent access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # Cache fonts with additional headers
    location ~* \.(woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }
    
    # Deny access to sensitive files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* (composer\.json|composer\.lock|package\.json|package-lock\.json|yarn\.lock|\.env|\.git|\.svn|\.htaccess|\.htpasswd) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    # Health check endpoint (useful for container orchestration)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Status endpoint (restricted to internal networks)
    location /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
    
    # Error pages
    error_page 404 /index.html;  # SPA fallback for 404
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # Compression settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/ld+json image/svg+xml;
    gzip_comp_level 6;
    gzip_proxied any;
    
    # Client settings
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    
    # Large file upload handling
    location /api/upload {
        client_max_body_size 100M;
        client_body_timeout 300s;
        proxy_pass http://nexos-backend:5000;
        # Include other proxy settings from /api/ location
    }
}

# WebSocket upgrade mapping (add this at the http level, outside server block)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
