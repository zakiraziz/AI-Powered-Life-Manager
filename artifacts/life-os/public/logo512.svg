<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="290" rx="116" fill="url(#shine)"/>
  <!-- Main sparkle with glow -->
  <path d="M256 100 L278.4 217.6 L396 240 L278.4 262.4 L256 380 L233.6 262.4 L116 240 L233.6 217.6 Z" fill="white" filter="url(#glow)"/>
  <!-- Small top-right -->
  <path d="M376 124 L383 156 L415 163 L383 170 L376 202 L369 170 L337 163 L369 156 Z" fill="white" opacity="0.8"/>
  <!-- Small bottom-left -->
  <path d="M136 310 L142.4 338.6 L171 345 L142.4 351.4 L136 380 L129.6 351.4 L101 345 L129.6 338.6 Z" fill="white" opacity="0.65"/>
</svg>
